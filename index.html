<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="スマホのブラウザで使える、端末内完結のシンプル動画編集アプリ" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Cpath d='M18 20h28v24H18z' fill='white' opacity='.22'/%3E%3Cpath d='m28 24 13 8-13 8z' fill='white'/%3E%3C/svg%3E" />
    <title>Clippo — かんたん動画編集</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Clippo">
          <span class="brand-mark">C</span>
          <span>Clippo</span>
        </div>
        <span class="privacy-badge">端末内で処理</span>
      </header>

      <section id="emptyState" class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M15 10l4.6-2.3a1 1 0 0 1 1.4.9v6.8a1 1 0 0 1-1.4.9L15 14M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/></svg>
        </div>
        <h1>動画を選んで、すぐ編集</h1>
        <p>アップロードは不要。動画はこの端末の中だけで処理されます。</p>
        <label class="primary-button file-button">
          動画を選ぶ
          <input id="fileInput" type="file" accept="video/*" />
        </label>
        <p class="format-note">MP4・MOV・WebM に対応</p>
      </section>

      <section id="editor" class="editor" hidden>
        <div class="preview-card">
          <video id="video" playsinline preload="metadata"></video>
          <button id="playButton" class="play-button" type="button" aria-label="再生">
            <svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>
          </button>
          <span id="previewTime" class="preview-time">0:00 / 0:00</span>
        </div>

        <div class="timeline-card">
          <div class="section-heading">
            <h2>使う範囲</h2>
            <span id="selectionLength">0:00</span>
          </div>
          <div class="range-wrap">
            <div class="range-track"></div>
            <div id="rangeFill" class="range-fill"></div>
            <input id="startRange" type="range" min="0" max="100" value="0" step="0.01" aria-label="開始位置" />
            <input id="endRange" type="range" min="0" max="100" value="100" step="0.01" aria-label="終了位置" />
          </div>
          <div class="time-row">
            <button id="setStart" class="time-chip" type="button"><span>開始</span><strong id="startTime">0:00.0</strong></button>
            <button id="setEnd" class="time-chip" type="button"><span>終了</span><strong id="endTime">0:00.0</strong></button>
          </div>
        </div>

        <div class="tools-card">
          <h2>仕上がり</h2>
          <div class="tool-row">
            <label for="aspect">画面サイズ</label>
            <select id="aspect">
              <option value="source">元のサイズ</option>
              <option value="9:16">縦 9:16</option>
              <option value="1:1">正方形 1:1</option>
              <option value="16:9">横 16:9</option>
            </select>
          </div>
          <div class="tool-row">
            <label for="brightness">明るさ <span id="brightnessValue">100%</span></label>
            <input id="brightness" type="range" min="60" max="140" value="100" />
          </div>
          <div class="tool-row compact">
            <div>
              <span class="tool-label">音声</span>
              <small>動画の音を含める</small>
            </div>
            <label class="switch">
              <input id="audioToggle" type="checkbox" checked />
              <span></span>
            </label>
          </div>
        </div>

        <div id="exportStatus" class="export-status" hidden>
          <div class="status-line"><span>動画を作成中…</span><strong id="progressText">0%</strong></div>
          <progress id="progress" max="100" value="0"></progress>
        </div>

        <div class="actions">
          <button id="changeVideo" class="secondary-button" type="button">別の動画</button>
          <button id="exportButton" class="primary-button" type="button">動画を書き出す</button>
        </div>
      </section>
    </main>
    <canvas id="renderCanvas" hidden></canvas>
    <script src="app.js"></script>
  </body>
</html>
